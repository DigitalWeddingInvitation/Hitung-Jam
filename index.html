<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Kalkulator Selisih Jam</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f4f6;
    color: #111827;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.header {
    text-align: center;
    margin: 15px 0 25px;
}

.header h1 {
    font-size: 28px;
    margin-bottom: 7px;
}

.header p {
    color: #6b7280;
    font-size: 14px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
    margin-bottom: 18px;
}

.time-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
}

.time-group {
    flex: 1;
}

.time-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #6b7280;
    margin-bottom: 8px;
}

.inputs {
    display: flex;
    align-items: center;
    gap: 5px;
}

.inputs input {
    width: 100%;
    height: 58px;
    border: 2px solid #e5e7eb;
    border-radius: 14px;
    background: #f9fafb;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    outline: none;
}

.inputs input:focus {
    border-color: #111827;
    background: white;
}

.colon {
    font-size: 25px;
    font-weight: bold;
}

.arrow {
    font-size: 23px;
    color: #6b7280;
    padding-bottom: 16px;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 13px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-hitung {
    flex: 1;
    background: #111827;
    color: white;
}

.btn-reset {
    width: 100px;
    background: #e5e7eb;
    color: #374151;
}

.result {
    text-align: center;
}

.result-title {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 8px;
}

.result-main {
    font-size: 38px;
    font-weight: 800;
    margin-bottom: 8px;
}

.result-detail {
    color: #6b7280;
    font-size: 14px;
}

.error {
    color: #dc2626;
    text-align: center;
    font-size: 14px;
    margin-top: 12px;
    display: none;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.history-header h2 {
    font-size: 18px;
}

.hapus-semua {
    background: none;
    color: #dc2626;
    padding: 5px;
    font-size: 13px;
}

.history-item {
    background: #f9fafb;
    border-radius: 13px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-time {
    font-weight: bold;
    font-size: 15px;
}

.history-result {
    font-weight: bold;
    text-align: right;
}

.empty {
    text-align: center;
    color: #9ca3af;
    font-size: 14px;
    padding: 15px 0;
}

.tips {
    margin-top: 18px;
    background: #f9fafb;
    border-radius: 14px;
    padding: 14px;
    font-size: 13px;
    color: #6b7280;
    line-height: 1.6;
}

@media (max-width: 380px) {
    .card {
        padding: 16px;
    }

    .arrow {
        font-size: 18px;
    }

    .inputs input {
        font-size: 21px;
    }

    .result-main {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>⏱️ Selisih Jam</h1>
        <p>Ketik jam → otomatis pindah ke menit</p>
    </div>

    <div class="card">

        <div class="time-row">

            <!-- JAM MULAI -->
            <div class="time-group">
                <label>Jam Mulai</label>

                <div class="inputs">
                    <input
                        type="text"
                        id="mulaiJam"
                        inputmode="numeric"
                        maxlength="2"
                        placeholder="12"
                        autocomplete="off"
                    >

                    <span class="colon">:</span>

                    <input
                        type="text"
                        id="mulaiMenit"
                        inputmode="numeric"
                        maxlength="2"
                        placeholder="50"
                        autocomplete="off"
                    >
                </div>
            </div>

            <div class="arrow">→</div>

            <!-- JAM SELESAI -->
            <div class="time-group">
                <label>Jam Selesai</label>

                <div class="inputs">
                    <input
                        type="text"
                        id="selesaiJam"
                        inputmode="numeric"
                        maxlength="2"
                        placeholder="17"
                        autocomplete="off"
                    >

                    <span class="colon">:</span>

                    <input
                        type="text"
                        id="selesaiMenit"
                        inputmode="numeric"
                        maxlength="2"
                        placeholder="25"
                        autocomplete="off"
                    >
                </div>
            </div>

        </div>

        <div class="buttons">
            <button class="btn-hitung" onclick="hitung()">
                HITUNG
            </button>

            <button class="btn-reset" onclick="resetForm()">
                RESET
            </button>
        </div>

        <div class="error" id="error"></div>

    </div>

    <!-- HASIL -->
    <div class="card" id="hasilCard" style="display:none;">

        <div class="result">

            <div class="result-title">
                Lama waktu
            </div>

            <div class="result-main" id="hasil">
                0 jam 0 menit
            </div>

            <div class="result-detail" id="detail">
                0 menit
            </div>

        </div>

    </div>

    <!-- RIWAYAT -->
    <div class="card">

        <div class="history-header">

            <h2>Riwayat</h2>

            <button
                class="hapus-semua"
                onclick="hapusRiwayat()">
                Hapus semua
            </button>

        </div>

        <div id="history">
            <div class="empty">
                Belum ada perhitungan.
            </div>
        </div>

    </div>

    <div class="tips">
        <b>Cara pakai:</b><br><br>

        Ketik <b>12</b> → otomatis pindah ke menit<br>
        Ketik <b>50</b> → otomatis lanjut ke jam selesai<br>
        Ketik <b>17</b> → otomatis pindah ke menit<br>
        Ketik <b>25</b> → tekan <b>HITUNG</b><br><br>

        Hasil: <b>4 jam 35 menit</b>
    </div>

</div>

<script>

const mulaiJam = document.getElementById("mulaiJam");
const mulaiMenit = document.getElementById("mulaiMenit");
const selesaiJam = document.getElementById("selesaiJam");
const selesaiMenit = document.getElementById("selesaiMenit");

const hasilCard = document.getElementById("hasilCard");
const hasil = document.getElementById("hasil");
const detail = document.getElementById("detail");
const error = document.getElementById("error");
const historyBox = document.getElementById("history");

let riwayat = JSON.parse(
    localStorage.getItem("riwayatJam")
) || [];


/* =========================
   INPUT OTOMATIS PINDAH
========================= */

function angkaSaja(input) {

    input.value = input.value.replace(/\D/g, "");

}


/* JAM MULAI */
mulaiJam.addEventListener("input", function() {

    angkaSaja(this);

    if (this.value.length >= 2) {
        mulaiMenit.focus();
    }

});


/* MENIT MULAI */
mulaiMenit.addEventListener("input", function() {

    angkaSaja(this);

    if (this.value.length >= 2) {
        selesaiJam.focus();
    }

});


/* JAM SELESAI */
selesaiJam.addEventListener("input", function() {

    angkaSaja(this);

    if (this.value.length >= 2) {
        selesaiMenit.focus();
    }

});


/* MENIT SELESAI */
selesaiMenit.addEventListener("input", function() {

    angkaSaja(this);

});


/* BACKSPACE BALIK KE KOLOM SEBELUMNYA */

mulaiMenit.addEventListener("keydown", function(e) {

    if (e.key === "Backspace" && this.value === "") {
        mulaiJam.focus();
    }

});

selesaiJam.addEventListener("keydown", function(e) {

    if (e.key === "Backspace" && this.value === "") {
        mulaiMenit.focus();
    }

});

selesaiMenit.addEventListener("keydown", function(e) {

    if (e.key === "Backspace" && this.value === "") {
        selesaiJam.focus();
    }

});


/* =========================
   HITUNG
========================= */

function hitung() {

    error.style.display = "none";

    if (
        mulaiJam.value === "" ||
        mulaiMenit.value === "" ||
        selesaiJam.value === "" ||
        selesaiMenit.value === ""
    ) {

        error.textContent =
            "Lengkapi semua kolom jam dan menit.";

        error.style.display = "block";

        hasilCard.style.display = "none";

        return;
    }


    let jm = Number(mulaiJam.value);
    let mm = Number(mulaiMenit.value);

    let js = Number(selesaiJam.value);
    let ms = Number(selesaiMenit.value);


    /* VALIDASI */

    if (
        jm > 23 ||
        js > 23 ||
        mm > 59 ||
        ms > 59
    ) {

        error.textContent =
            "Jam harus 00–23 dan menit harus 00–59.";

        error.style.display = "block";

        return;
    }


    /* UBAH KE MENIT */

    let waktuMulai =
        jm * 60 + mm;

    let waktuSelesai =
        js * 60 + ms;


    let selisih =
        waktuSelesai - waktuMulai;


    /* MELEWATI TENGAH MALAM */

    if (selisih < 0) {
        selisih += 24 * 60;
    }


    let jam =
        Math.floor(selisih / 60);

    let menit =
        selisih % 60;


    /* HASIL */

    hasil.textContent =
        `${jam} jam ${menit} menit`;

    detail.textContent =
        `${selisih} menit`;


    hasilCard.style.display = "block";


    /* SIMPAN RIWAYAT */

    riwayat.unshift({

        mulai:
            formatWaktu(jm, mm),

        selesai:
            formatWaktu(js, ms),

        hasil:
            `${jam} jam ${menit} menit`

    });


    riwayat =
        riwayat.slice(0, 20);


    localStorage.setItem(
        "riwayatJam",
        JSON.stringify(riwayat)
    );


    tampilkanRiwayat();

}


/* =========================
   FORMAT JAM
========================= */

function formatWaktu(jam, menit) {

    return String(jam).padStart(2, "0")
        + ":"
        + String(menit).padStart(2, "0");

}


/* =========================
   RIWAYAT
========================= */

function tampilkanRiwayat() {

    if (riwayat.length === 0) {

        historyBox.innerHTML = `
            <div class="empty">
                Belum ada perhitungan.
            </div>
        `;

        return;
    }


    historyBox.innerHTML =
        riwayat.map(item => `

            <div class="history-item">

                <div class="history-time">
                    ${item.mulai}
                    →
                    ${item.selesai}
                </div>

                <div class="history-result">
                    ${item.hasil}
                </div>

            </div>

        `).join("");

}


/* =========================
   RESET
========================= */

function resetForm() {

    mulaiJam.value = "";
    mulaiMenit.value = "";
    selesaiJam.value = "";
    selesaiMenit.value = "";

    hasilCard.style.display = "none";

    error.style.display = "none";

    mulaiJam.focus();

}


/* =========================
   HAPUS RIWAYAT
========================= */

function hapusRiwayat() {

    if (riwayat.length === 0) return;


    if (
        confirm("Hapus semua riwayat?")
    ) {

        riwayat = [];

        localStorage.removeItem(
            "riwayatJam"
        );

        tampilkanRiwayat();

    }

}


/* TAMPILKAN RIWAYAT SAAT DIBUKA */

tampilkanRiwayat();

</script>

</body>
</html>
